name = "LAMMPS"
grammar = "lammps"
path_suffixes = ["in"]
line_comments = ["#"]
word_characters = ["$", "_"]
increase_indent_pattern = "&\\s*$"
tab_size = 2
hard_tabs = false

# 括号自动闭合配置
brackets = [
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string"] },
  { start = "(", end = ")", close = true, newline = false },
  { start = "[", end = "]", close = true, newline = false },
  { start = "{", end = "}", close = true, newline = false },
]

# 字符串内禁用自动补全触发（$ 在字符串中是字面量）
[overrides.string]
completion_query_characters = []

# 注释内禁用自动补全触发
[overrides.comment]
completion_query_characters = []
