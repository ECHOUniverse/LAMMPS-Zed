name = "LAMMPS Data"
grammar = "lammps_data"
path_suffixes = ["data", "lmp"]
first_line_pattern = '^(#|\s*\d+\s+(atoms|atom types|bonds|bond types|angles|angle types))'
line_comments = ["#"]
tab_size = 2
hard_tabs = false

# 括号自动闭合配置
brackets = [
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
  { start = "(", end = ")", close = true, newline = false },
  { start = "[", end = "]", close = true, newline = false },
]

# 注释内禁用自动补全触发
[overrides.comment]
completion_query_characters = []
