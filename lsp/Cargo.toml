[package]
name = "lammps-lsp"
version = "0.3.0"
edition = "2024"
description = "LAMMPS Language Server Protocol implementation"
repository = "https://github.com/ECHOUniverse/LAMMPS-Zed"
license = "MIT"

[[bin]]
name = "lammps-lsp"
path = "src/main.rs"

[dependencies]
tower-lsp-server = { version = "0.23", features = ["proposed"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.24"
tree-sitter-lammps = "0.0.8"
toml = "0.8"
once_cell = "1"
log = "0.4"
env_logger = "0.11"
anyhow = "1"

[build-dependencies]
toml = "0.8"

[dev-dependencies]
tempfile = "3"
