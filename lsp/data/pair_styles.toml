[[styles]]
name = "none"
category = "Pair"
since_version = "1995"
doc_short = "No pairwise interactions"
doc_full = "Turn off pairwise interactions. No neighbor lists are built and no pairwise forces are computed.\n\n[Documentation](https://docs.lammps.org/pair_style.html)"
required_args = []
optional_args = []
related_commands = []

[[styles]]
name = "lj/cut"
category = "Pair"
since_version = "1995"
doc_short = "Lennard-Jones potential with a cutoff"
doc_full = "The standard 12-6 Lennard-Jones potential with a cutoff. Parameters: epsilon and sigma.\n\n[Documentation](https://docs.lammps.org/pair_lj.html)"
required_args = [
  { name = "cutoff", param_type = "Float", required = true, doc = "Global cutoff for LJ interactions" },
]
optional_args = []
related_commands = ["pair_modify", "pair_coeff"]

[[styles]]
name = "lj/cut/coul/cut"
category = "Pair"
since_version = "2005"
doc_short = "LJ + Coulombic with cutoffs"
doc_full = "Lennard-Jones and Coulombic potentials, both using a simple cutoff.\n\n[Documentation](https://docs.lammps.org/pair_lj.html)"
required_args = [
  { name = "cutoff", param_type = "Float", required = true, doc = "Global cutoff for LJ interactions" },
]
optional_args = [
  { name = "cutoff_coul", param_type = "Float", required = false, doc = "Cutoff for Coulombic (defaults to LJ cutoff)" },
]
related_commands = ["pair_modify", "pair_coeff", "kspace_style"]

[[styles]]
name = "lj/cut/coul/long"
category = "Pair"
since_version = "2005"
doc_short = "LJ cutoff + Coulombic long-range"
doc_full = "Lennard-Jones with cutoff, plus long-range Coulombic via kspace_style (Ewald/PPPM).\n\n[Documentation](https://docs.lammps.org/pair_lj.html)"
required_args = [
  { name = "cutoff", param_type = "Float", required = true, doc = "Global cutoff for LJ and short-range Coulombic" },
]
optional_args = [
  { name = "cutoff_coul", param_type = "Float", required = false, doc = "Cutoff for Coulombic (defaults to LJ cutoff)" },
]
related_commands = ["pair_modify", "pair_coeff", "kspace_style"]

