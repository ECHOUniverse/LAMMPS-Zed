parameters = [
  { name = "keyword", param_type = "String", required = true, doc = "Parameter keyword" },
  { name = "values", param_type = "Repeat(String)", required = false, doc = "Value(s)" },
]

[[commands]]
name = "change_box"
category = "Setup"
doc_short = "Change the simulation box size/shape"
