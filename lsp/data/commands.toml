  { name = "command", param_type = "String", required = true, doc = "Command to execute if condition is true" },
]

[[commands]]
name = "shell"
category = "Control"
doc_short = "Execute a shell command"
doc_full = "Execute a shell command during the simulation.\n\n[Documentation](https://docs.lammps.org/shell.html)"
