parameters = [
  { name = "N", param_type = "Integer", required = true, doc = "Write restart every N steps (0 to turn off)" },
  { name = "file", param_type = "FileName", required = true, doc = "Restart file name template" },
  { name = "args", param_type = "Repeat(String)", required = false, doc = "Optional keywords/values" },
]

[[commands]]
