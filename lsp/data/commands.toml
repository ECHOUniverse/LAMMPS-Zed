  { name = "style", param_type = "Style", required = true, doc = "Selection style (type, group, region)" },
  { name = "args", param_type = "Repeat(String)", required = true, doc = "Selection arguments and attribute assignments" },
]

[[commands]]
name = "mass"
category = "Setup"
doc_short = "Set atom type masses"
doc_full = "Set the mass for one or more atom types.\n\n[Documentation](https://docs.lammps.org/mass.html)"
parameters = [
  { name = "I", param_type = "String", required = true, doc = "Atom type or range" },
  { name = "value", param_type = "Float", required = true, doc = "Mass value" },
]

[[commands]]
name = "velocity"
category = "Setup"
doc_short = "Set atom velocities"
doc_full = "Set or change the velocities of a group of atoms.\n\n[Documentation](https://docs.lammps.org/velocity.html)"
