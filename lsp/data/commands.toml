]

[[commands]]
name = "read_restart"
category = "Input"
doc_short = "Read a restart file"
doc_full = "Read a binary restart file to continue a previous simulation.\n\n[Documentation](https://docs.lammps.org/read_restart.html)"
parameters = [
  { name = "file", param_type = "FileName", required = true, doc = "Name of restart file" },
]

