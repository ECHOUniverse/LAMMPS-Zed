  { name = "style", param_type = "Enum(['group', 'region', 'overlap', 'porosity'])", required = true, doc = "Deletion style" },
  { name = "args", param_type = "Repeat(String)", required = false, doc = "Arguments for deletion style" },
]

[[commands]]
name = "displace_atoms"
