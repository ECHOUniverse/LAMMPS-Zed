[[commands]]
name = "pair_style"
category = "Setup"
doc_short = "Set the formula(s) LAMMPS uses to compute pairwise interactions"
doc_full = "Set the formula(s) LAMMPS uses to compute pairwise interactions. In LAMMPS, pair potentials are defined between pairs of atoms that are within a cutoff distance. The pair_style command selects which formula(s) to use.\n\n[Documentation](https://docs.lammps.org/pair_style.html)"
parameters = [
  { name = "style", param_type = "Style", required = true, doc = "One of the styles from the pair_style list" },
  { name = "args", param_type = "Repeat(String)", required = false, doc = "Arguments specific to the pair style" },
]

[[commands]]
name = "pair_coeff"
category = "Setup"
doc_short = "Specify the pairwise force field coefficients"
doc_full = "Specify the pairwise force field coefficients for one or more pairs of atom types. The number and meaning of the coefficients depends on the pair style.\n\n[Documentation](https://docs.lammps.org/pair_coeff.html)"
parameters = [
  { name = "I", param_type = "String", required = true, doc = "Atom type or range (e.g., * or 1*3)" },
  { name = "J", param_type = "String", required = true, doc = "Atom type or range" },
  { name = "coeffs", param_type = "Repeat(Float)", required = true, doc = "Coefficients specific to the pair style" },
]

[[commands]]
name = "pair_modify"
category = "Setup"
doc_short = "Modify parameters of the pair style"
doc_full = "Modify parameters of the currently defined pair style, such as the mixing rule or table parameters.\n\n[Documentation](https://docs.lammps.org/pair_modify.html)"
parameters = [
  { name = "keyword", param_type = "String", required = true, doc = "Parameter keyword to modify" },
  { name = "values", param_type = "Repeat(String)", required = false, doc = "New value(s) for the parameter" },
]

[[commands]]
name = "pair_write"
category = "Output"
doc_short = "Write pairwise interaction table"
doc_full = "Write the pairwise energy and force values to a file as a tabulated potential.\n\n[Documentation](https://docs.lammps.org/pair_write.html)"
parameters = [
  { name = "itype", param_type = "Integer", required = true, doc = "Atom type I" },
  { name = "jtype", param_type = "Integer", required = true, doc = "Atom type J" },
  { name = "N", param_type = "Integer", required = true, doc = "Number of table entries" },
  { name = "inner", param_type = "Float", required = true, doc = "Inner cutoff" },
  { name = "outer", param_type = "Float", required = true, doc = "Outer cutoff" },
  { name = "file", param_type = "FileName", required = true, doc = "Output file name" },
]

