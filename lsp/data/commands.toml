[[commands]]
name = "fix"
category = "Simulation"
doc_short = "Apply a fix to a group of atoms"
doc_full = "Set a fix that will be applied to a group of atoms. In LAMMPS, a 'fix' is any operation that is applied to the system during timestepping or minimization. Fixes include time integration, force constraints, boundary conditions, diagnostics, and more.\n\n[Documentation](https://docs.lammps.org/fix.html)"
parameters = [
  { name = "ID", param_type = "FixId", required = true, doc = "User-assigned name for the fix" },
  { name = "group-ID", param_type = "GroupId", required = true, doc = "ID of the group the fix will be applied to" },
  { name = "style", param_type = "Style", required = true, doc = "One of the styles from the fix list" },
  { name = "args", param_type = "Repeat(String)", required = false, doc = "Arguments specific to the fix style" },
]

[[commands]]
name = "unfix"
category = "Simulation"
doc_short = "Remove a previously defined fix"
doc_full = "Delete a fix that was previously defined with the fix command. The fix is removed from the system.\n\n[Documentation](https://docs.lammps.org/unfix.html)"
parameters = [
  { name = "ID", param_type = "FixId", required = true, doc = "ID of a previously defined fix" },
]

[[commands]]
name = "fix_modify"
category = "Simulation"
doc_short = "Modify parameters of a previously defined fix"
doc_full = "Modify one or more parameters of a previously defined fix. Not all fix styles support all parameters.\n\n[Documentation](https://docs.lammps.org/fix_modify.html)"
