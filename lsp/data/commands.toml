  { name = "file", param_type = "FileName", required = true, doc = "Name of file to write" },
  { name = "args", param_type = "Repeat(String)", required = false, doc = "Optional keyword/value pairs" },
]

[[commands]]
name = "write_restart"
category = "Output"
doc_short = "Write a binary restart file"
doc_full = "Write a binary restart file of the current simulation state.\n\n[Documentation](https://docs.lammps.org/write_restart.html)"
