category = "Control"
doc_short = "Exit LAMMPS"
doc_full = "Exit LAMMPS with an optional exit status.\n\n[Documentation](https://docs.lammps.org/quit.html)"
parameters = [
  { name = "status", param_type = "Integer", required = false, doc = "Exit status (optional)" },
]

[[commands]]
name = "replicate"
