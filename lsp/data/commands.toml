doc_full = "Set the dimensionality of the simulation: 2d or 3d.\n\n[Documentation](https://docs.lammps.org/dimension.html)"
parameters = [
  { name = "N", param_type = "Enum(['2', '3'])", required = true, doc = "2 or 3 dimensions" },
]

[[commands]]
name = "boundary"
category = "Setup"
doc_short = "Set the boundary conditions"
doc_full = "Set the style of boundary conditions for the global simulation box in each dimension: p (periodic), f (fixed), s (shrink-wrapped), or m (shrink-wrapped with minimum value).\n\n[Documentation](https://docs.lammps.org/boundary.html)"
parameters = [
  { name = "x", param_type = "Enum(['p', 'f', 's', 'm'])", required = true, doc = "Boundary condition in x direction" },
  { name = "y", param_type = "Enum(['p', 'f', 's', 'm'])", required = true, doc = "Boundary condition in y direction" },
  { name = "z", param_type = "Enum(['p', 'f', 's', 'm'])", required = true, doc = "Boundary condition in z direction" },
]

[[commands]]
name = "atom_style"
category = "Setup"
doc_short = "Define which per-atom attributes are stored"
doc_full = "Define what attributes are associated with each atom. This determines what data is stored, communicated, and output.\n\n[Documentation](https://docs.lammps.org/atom_style.html)"
parameters = [
  { name = "style", param_type = "Enum(['atomic', 'charge', 'sphere', 'ellipsoid', 'full', 'molecular', 'body', 'line', 'tri', 'template', 'hybrid'])", required = true, doc = "Atom style" },
  { name = "args", param_type = "Repeat(String)", required = false, doc = "Arguments for hybrid style" },
]

[[commands]]
name = "atom_modify"
category = "Setup"
doc_short = "Modify per-atom attributes"
doc_full = "Modify certain per-atom properties.\n\n[Documentation](https://docs.lammps.org/atom_modify.html)"
parameters = [
  { name = "keyword", param_type = "String", required = true, doc = "Property keyword" },
  { name = "values", param_type = "Repeat(String)", required = false, doc = "Value(s)" },
]

[[commands]]
name = "lattice"
category = "Setup"
doc_short = "Define a crystal lattice"
doc_full = "Define a crystal lattice for use by other commands like create_atoms.\n\n[Documentation](https://docs.lammps.org/lattice.html)"
parameters = [
  { name = "style", param_type = "Enum(['none', 'sc', 'bcc', 'fcc', 'hcp', 'diamond', 'zincblende', 'rocksalt', 'cesiumchloride', 'fluorite', 'perovskite', 'custom'])", required = true, doc = "Lattice style" },
  { name = "scale", param_type = "Float", required = true, doc = "Lattice constant (distance units)" },
  { name = "args", param_type = "Repeat(String)", required = false, doc = "Additional arguments" },
]

[[commands]]
name = "region"
category = "Setup"
doc_short = "Define a geometric region"
doc_full = "Define a geometric region of space. Regions can be used to create atoms, apply fixes, select groups, etc.\n\n[Documentation](https://docs.lammps.org/region.html)"
parameters = [
  { name = "ID", param_type = "String", required = true, doc = "User-assigned name" },
  { name = "style", param_type = "Enum(['block', 'cone', 'cylinder', 'prism', 'sphere', 'union', 'intersect'])", required = true, doc = "Region style" },
  { name = "args", param_type = "Repeat(String)", required = true, doc = "Geometric parameters" },
]

[[commands]]
name = "create_box"
category = "Setup"
doc_short = "Create a simulation box"
doc_full = "Create a simulation box based on the previously defined lattice and region.\n\n[Documentation](https://docs.lammps.org/create_box.html)"
parameters = [
  { name = "N", param_type = "Integer", required = true, doc = "Number of atom types" },
  { name = "region-ID", param_type = "String", required = true, doc = "ID of region to use for box" },
  { name = "args", param_type = "Repeat(String)", required = false, doc = "Optional keyword/value pairs" },
]

[[commands]]
name = "create_atoms"
category = "Setup"
doc_short = "Create atoms on a lattice"
doc_full = "Create atoms on a lattice, or on a subset of lattice sites, within the simulation box.\n\n[Documentation](https://docs.lammps.org/create_atoms.html)"
parameters = [
  { name = "type", param_type = "Integer", required = true, doc = "Atom type" },
  { name = "style", param_type = "Enum(['box', 'region', 'single', 'random'])", required = true, doc = "Creation style" },
  { name = "args", param_type = "Repeat(String)", required = false, doc = "Arguments for creation style" },
]

[[commands]]
name = "delete_atoms"
category = "Setup"
doc_short = "Delete atoms from the system"
doc_full = "Delete atoms from the system that match certain criteria.\n\n[Documentation](https://docs.lammps.org/delete_atoms.html)"
