]

[[commands]]
name = "reset_timestep"
category = "Setup"
doc_short = "Reset the timestep counter"
doc_full = "Set the timestep counter to a specified value.\n\n[Documentation](https://docs.lammps.org/reset_timestep.html)"
parameters = [
  { name = "N", param_type = "Integer", required = true, doc = "New timestep value" },
]

[[commands]]
name = "restart"
category = "Output"
doc_short = "Write restart files during a run"
