category = "Control"
doc_short = "Conditionally execute a command"
doc_full = "Conditionally execute a command based on a Boolean expression.\n\n[Documentation](https://docs.lammps.org/if.html)"
parameters = [
  { name = "condition", param_type = "Expression", required = true, doc = "Boolean expression" },
