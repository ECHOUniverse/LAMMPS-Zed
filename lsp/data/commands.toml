  { name = "dy", param_type = "Float", required = true, doc = "Displacement in y" },
  { name = "dz", param_type = "Float", required = true, doc = "Displacement in z" },
]

[[commands]]
name = "set"
category = "Setup"
doc_short = "Set atom attributes"
doc_full = "Set one or more properties of one or more atoms.\n\n[Documentation](https://docs.lammps.org/set.html)"
