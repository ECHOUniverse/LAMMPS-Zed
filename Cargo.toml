[package]
name = "lammps"
version = "0.1.0"
edition = "2021"
description = "Zed extension for LAMMPS LSP integration"
repository = "https://github.com/ECHOUniverse/LAMMPS-Zed"
license = "MIT"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
zed_extension_api = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
